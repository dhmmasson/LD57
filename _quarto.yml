project:
  type: website
  preview:
    port: 6499
  resources: 
    - ./assets/**/*.png
    - ./assets/**/*.jpg
    - ./assets/**/*.wav
    - ./assets/**/*.mp3 

website:
  title: "Focus Hunt"
  site-url: "https://dhmmasson.github.io/focusHunt/"
  navbar:
    left:
      - href: index.qmd
        text: Home
  open-graph:   
    locale: "en_US"    
  description: "My Entry for Ludum Dare 57. A game made in 48 hours."
  
  twitter-card: 
    card-style: "summary_large_image"
    creator: "@dhmmasson"
  page-footer: 
    left: 
      - text: "Ludum Dare 57 (2025) - Dimitri Masson - MIT License"
    right:
      - text: "Star the project on GitHub"
      - icon: github

format:
  html:
    theme: 
      - cosmo
      - assets/ld57-theme.scss
    css: styles.css
    toc: false
    page-layout: full
    email-obfuscation: javascript
    appendix-cite-as: display
    title-block-style: manuscript
    image: "assets/splash.png"
    image-width: "640px"
    image-height: "512px"
    license: "MIT"



